<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Document</title>
  </head>
  <body>
    <header class="header-koyotl position-relative">
      <!-- ==========================================
       1. TOP BAR (Barra Negra Superior)
       ========================================== -->
      <div class="top-bar bg-black text-white py-3 px-4">
        <div
          class="container-fluid d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 barra-content"
        >
          <!-- Lado Izquierdo: Logo Koyotl + Slogan -->
          <div
            class="contenedor-headerL d-flex flex-column align-items-center align-items-md-start"
          >
            <img
              class="koyotlHeader"
              src="img/home/KoyotlLogo.png"
              alt="Koyotl Logo"
            />
            <p class="slogan mb-0">
              Personaliza tu estilo, Personaliza tu vida
            </p>
          </div>

          <!-- Lado Derecho: Cart & Sign In -->
          <div class="contenedor-headerR d-flex align-items-center gap-3">
            <a href="#" class="enlace-top">
              CART <span class="fa-solid fa-cart-shopping icon"></span>
            </a>
            <span class="separadorEnlace">|</span>
            <a href="#" class="enlace-top">
              SIGN IN
              <span class="fa-solid fa-arrow-right-to-bracket icon"></span>
            </a>
          </div>
        </div>
      </div>

      <!-- ==========================================
       2. NAV FLOTANTE CON GRADIENTE
       ========================================== -->
      <nav class="nav-koyotl w-100">
        <div class="container-fluid contenedor-nav px-4 px-lg-5">
          <!-- Enlaces Izquierda -->
          <div class="navL">
            <a href="#" class="enlaces-nav">HOME</a>
            <a href="#" class="enlaces-nav">
              SHOWROOM <span class="fa-solid fa-angle-down icon-arrow"></span>
            </a>
          </div>

          <!-- Logo Central (Corta hacia arriba) -->
          <div class="contenedor-logo-center">
            <img
              class="logo"
              src="img/home/KoyotlCut.png"
              alt="Koyotl Emblem"
            />
          </div>

          <!-- Enlaces Derecha -->
          <div class="navR">
            <a href="#" class="enlaces-nav">CONTACT</a>
            <a href="#" class="enlaces-nav">ABOUT</a>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- ==========================================
       BANNER PRINCIPAL CON CAPA COMPARTIDA (GRID)
       ========================================== -->
      <div class="contenedor-main">
        <!-- Capa 1 (Fondo): Imagen del auto -->
        <img
          class="Banner"
          src="img/home/hOME_sintexto.png"
          alt="Honda Civic Gris Koyotl"
        />

        <!-- Capa 2 (Superpuesta): Enlaces de navegación inferior -->
        <div class="contenedor-enlacesBanner">
          <a href="#aerodinamica" class="enlacesInferiores">
            Aerodinámica y Exterior
          </a>

          <span class="separadorEnlaceInferior" aria-hidden="true">|</span>

          <a href="#cabina" class="enlacesInferiores">
            Equipamiento de Cabina
          </a>

          <span class="separadorEnlaceInferior" aria-hidden="true">|</span>

          <a href="#rendimiento" class="enlacesInferiores">
            Rendimiento y Chasis
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
